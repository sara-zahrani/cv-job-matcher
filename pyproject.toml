[project]
name = "cv-job-matcher"
version = "0.1.0"
description = "RAG application that matches a CV against ingested job postings"
readme = "README.md"
authors = [
    { name = "Sara Abdullah Alzahrani", email = "sara.zahrani32@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "deltalake>=1.6.3",
    "fastapi[standard]>=0.141.1",
    "openai>=3.14.1",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pypdf",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.0",
]
